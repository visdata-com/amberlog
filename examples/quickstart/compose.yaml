# 一键试用：Silo（对象存储，MinIO 的社区分支）＋ Amberlog ＋ DuckDB（外部查询引擎）。用法见同目录的 README.md（英文）或 README.zh-CN.md（中文）。
# Quickstart: Silo (object storage, a community fork of MinIO) + Amberlog + DuckDB (external query engine). See README.md (English) or README.zh-CN.md (Chinese) in this directory.
# 只供在本机试用：口令与令牌都是写死的示例值，Amberlog 以明文监听，端口只开在 127.0.0.1。不要用于生产。
# For local trials only: passwords and tokens are fixed example values, Amberlog listens in plaintext, and ports are open only on 127.0.0.1. Do not use in production.
name: amberlog-quickstart

services:
  minio:
    # Silo：PGSTY 维护的 MinIO 社区分支（AGPL-3.0），MinIO 上游已归档、不再发布镜像。按 tag 与摘要固定。
    # Silo: the community fork of MinIO maintained by PGSTY (AGPL-3.0); upstream MinIO is archived and no longer publishes images. Pinned by tag and digest.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: quickstart-admin
      MINIO_ROOT_PASSWORD: quickstart-admin-secret
    ports:
      - "127.0.0.1:9000:9000"   # S3 接口 / S3 API
      - "127.0.0.1:9001:9001"   # MinIO/Silo 控制台，可用上面的管理员账号登录查看桶里的对象 / MinIO/Silo console; log in with the admin account above to browse the bucket
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  # 一次性作业：建桶，建两个用户。
  # One-off job: create the bucket and two users.
  # - amberlog-app：Amberlog 自己用的读写凭据，只能访问桶 amberlog-data。
  #   Read-write credentials for Amberlog itself; access to the bucket amberlog-data only.
  # - lake-reader：交给外部引擎的只读凭据，只能读取与列举 amberlog/_iceberg 之下的冷层表。
  #   Read-only credentials for external engines; can only read and list the cold-tier tables under amberlog/_iceberg.
  setup:
    # 与 minio 服务同一个镜像：Silo 镜像里自带 mc（Silo 维护的 MinIO Client 分支）。
    # Same image as the minio service: the Silo image includes mc (Silo's fork of the MinIO Client).
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 quickstart-admin quickstart-admin-secret
        mc mb --ignore-existing local/amberlog-data
        cat > /tmp/app.json <<'POLICY'
        {"Version": "2012-10-17", "Statement": [
          {"Effect": "Allow", "Action": ["s3:*"],
           "Resource": ["arn:aws:s3:::amberlog-data", "arn:aws:s3:::amberlog-data/*"]}
        ]}
        POLICY
        cat > /tmp/reader.json <<'POLICY'
        {"Version": "2012-10-17", "Statement": [
          {"Effect": "Allow", "Action": ["s3:GetObject"],
           "Resource": ["arn:aws:s3:::amberlog-data/amberlog/_iceberg",
                        "arn:aws:s3:::amberlog-data/amberlog/_iceberg/*"]},
          {"Effect": "Allow", "Action": ["s3:ListBucket"],
           "Resource": ["arn:aws:s3:::amberlog-data"],
           "Condition": {"StringLike": {"s3:prefix": ["amberlog/_iceberg", "amberlog/_iceberg/", "amberlog/_iceberg/*"]}}},
          {"Effect": "Allow", "Action": ["s3:GetBucketLocation"],
           "Resource": ["arn:aws:s3:::amberlog-data"]}
        ]}
        POLICY
        mc admin user add local amberlog-app amberlog-app-secret
        mc admin policy create local quickstart-app /tmp/app.json
        mc admin policy attach local quickstart-app --user amberlog-app
        mc admin user add local lake-reader lake-reader-secret
        mc admin policy create local quickstart-reader /tmp/reader.json
        mc admin policy attach local quickstart-reader --user lake-reader

  amberlog:
    # 默认取最新的正式版镜像。要用指定版本或自己构建的镜像时，设环境变量 QUICKSTART_IMAGE，
    # 如 QUICKSTART_IMAGE=ghcr.io/visdata-com/amberlog:0.1.0。
    # Uses the latest release image by default. To use a specific version or your own build, set QUICKSTART_IMAGE,
    # e.g. QUICKSTART_IMAGE=ghcr.io/visdata-com/amberlog:0.1.0.
    image: ${QUICKSTART_IMAGE:-ghcr.io/visdata-com/amberlog:latest}
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      AMBERLOG_OBJECT_STORE__URL: s3://amberlog-data
      AMBERLOG_OBJECT_STORE__S3__ENDPOINT: http://minio:9000
      AMBERLOG_OBJECT_STORE__S3__FORCE_PATH_STYLE: "true"
      AMBERLOG_OBJECT_STORE__S3__CONDITIONAL_PUT: create_only
      AMBERLOG_OBJECT_STORE__S3__ACCESS_KEY_ID: amberlog-app
      AMBERLOG_OBJECT_STORE__S3__SECRET_ACCESS_KEY: amberlog-app-secret
      AMBERLOG_WAL__DIR: /var/lib/amberlog/wal
      AMBERLOG_AUTH__TOKEN: quickstart-token
      # 容器里要在 0.0.0.0 上监听，端口才能映射出来。非回环地址上以明文监听必须写这条声明，否则拒绝启动。
      # 这里没有反向代理，只因端口只开在本机的 127.0.0.1 上才这样写。正式部署要配证书，或真的放在终止 TLS 的反向代理后面。
      # Inside the container Amberlog must listen on 0.0.0.0 for the port mapping to work. Plaintext listening on a
      # non-loopback address requires this declaration, or Amberlog refuses to start. There is no reverse proxy here;
      # this is written only because the port is open on the host's 127.0.0.1 alone. In production, configure a
      # certificate, or really put Amberlog behind a reverse proxy that terminates TLS.
      AMBERLOG_SERVER__BEHIND_TLS_PROXY: "true"
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - amberlog-wal:/var/lib/amberlog
    healthcheck:
      # 镜像里没有 curl，用 bash 向 /readyz 发一个请求，回 200 才算就绪。
      # The image has no curl: bash sends one request to /readyz, and only a 200 response counts as ready.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8800 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 2s
      retries: 30

  # 外部查询引擎：DuckDB 1.5.6，用只读凭据直接读 MinIO/Silo 里的冷层表，不经过 Amberlog。
  # External query engine: DuckDB 1.5.6 reads the cold-tier tables in MinIO/Silo directly with the read-only credentials, bypassing Amberlog.
  # 常驻不退出，用 docker compose exec duckdb lake-query "<SQL>" 执行查询。
  # It keeps running; run queries with docker compose exec duckdb lake-query "<SQL>".
  duckdb:
    build: ./duckdb
    image: amberlog-quickstart-duckdb
    init: true
    command: ["sleep", "infinity"]
    environment:
      LAKE_S3_ENDPOINT: minio:9000
      LAKE_S3_KEY_ID: lake-reader
      LAKE_S3_SECRET: lake-reader-secret
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  minio-data:
  amberlog-wal:
